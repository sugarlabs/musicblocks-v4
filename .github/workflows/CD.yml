---
# Documentation:https://help.github.com/en/articles/workflow-syntax-for-github-actions

name: Continuous Deployment

on:
  push:
    branches: [develop]

# No job gets any access unless it asks for it below.
permissions: {}

jobs:
  deploy:
    name: Build and Deploy app to GitHub Pages

    runs-on: ubuntu-latest

    # Pushing the built site to the gh-pages branch is the only write this job needs.
    permissions:
      contents: write

    steps:
      - name: Checkout the code base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup

      - name: Build for Production
        run: npm run build:gh

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./app/dist
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          full_commit_message: 'deploy: publish app to GitHub Pages'
