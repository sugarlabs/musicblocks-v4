name: Setup
description: Setup Node.js 22 with npm cache and install dependencies

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        registry-url: 'https://npm.pkg.github.com'
        cache: 'npm'

    - run: npm ci
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ github.token }}
